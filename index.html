<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305050f'/%3E%3Cpath d='M16 16 L28 9 A14 14 0 1 0 28 23 Z' fill='%23ffd23f'/%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>パックマン クローン</title>
<style>
  :root {
    --bg: #05050f;
    --panel: #0d0d22;
    --accent: #ffd23f;
    --text: #e8e8ff;
    --wall: #2b4cff;
    --chrome: 150px;
    --w: min(560px, calc(100vw - 24px), calc((100vh - var(--chrome)) * .9032));
  }
  @supports (height: 100dvh) {
    :root { --w: min(560px, calc(100vw - 24px), calc((100dvh - var(--chrome)) * .9032)); }
  }
  @media (pointer: coarse) { :root { --chrome: 340px; } }
  .touch { --chrome: 340px; }

  * { box-sizing: border-box; }
  html, body { overscroll-behavior: none; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #14143a 0%, var(--bg) 70%) var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  header, #hud, #touch { width: var(--w); }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: .3em;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(255, 210, 63, .5);
  }
  .icon {
    border: 1px solid #2b4cff66;
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    font-size: 16px;
    line-height: 1;
    padding: 6px 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .icon:hover { background: #1b1b44; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  #lives { display: flex; gap: 6px; align-items: center; min-width: 54px; justify-content: flex-end; }
  .life {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    clip-path: polygon(100% 25%, 45% 50%, 100% 75%, 100% 100%, 0 100%, 0 0, 100% 0);
  }
  #wrap {
    position: relative;
    width: var(--w);
    line-height: 0;
    touch-action: none;
    background: #000;
    border: 2px solid #23237a;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(40, 40, 200, .35);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    padding: 12px;
    background: rgba(0, 0, 0, .68);
    text-align: center;
    line-height: 1.6;
    font-size: clamp(13px, 3.4vw, 16px);
  }
  #overlay div { text-wrap: balance; }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: clamp(20px, 6vw, 26px); color: var(--accent); letter-spacing: .1em; }
  #overlay .small { font-size: 12px; opacity: .75; }
  #diffPick { display: flex; gap: 8px; margin: 4px 0; }
  .dbtn {
    border: 1px solid #2b4cff88;
    background: var(--panel);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    letter-spacing: .08em;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .dbtn[aria-pressed="true"] { background: var(--accent); color: #1a1500; border-color: var(--accent); font-weight: 700; }
  footer { font-size: 12px; opacity: .6; text-align: center; max-width: var(--w); }

  #touch { display: none; justify-content: center; }
  .touch #touch { display: flex; }
  @media (pointer: coarse) { #touch { display: flex; } }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 8px;
    grid-template-areas:
      ".    up      restart"
      "left action  right"
      ".    down    .";
  }
  .tbtn {
    border: 1px solid #2b4cff66;
    background: var(--panel);
    color: var(--accent);
    border-radius: 12px;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    padding: 0;
  }
  .tbtn:active { background: #23237a; transform: scale(.94); }
  .tbtn[data-dir="up"] { grid-area: up; }
  .tbtn[data-dir="down"] { grid-area: down; }
  .tbtn[data-dir="left"] { grid-area: left; }
  .tbtn[data-dir="right"] { grid-area: right; }
  .tbtn.action { grid-area: action; font-size: 24px; border-color: var(--accent); }
  .tbtn.restart { grid-area: restart; font-size: 16px; opacity: .8; }

  @media (max-width: 420px), (pointer: coarse) { footer { display: none; } }

  /* 横向き（高さが低い）画面：盤面を左、情報と十字ボタンを右に並べて高さを使い切る */
  @media (orientation: landscape) and (max-height: 540px) {
    :root, .touch { --chrome: 36px; }
    body {
      display: grid;
      grid-template-columns: var(--w) 200px;
      grid-template-areas: "wrap header" "wrap hud" "wrap touch";
      grid-template-rows: auto auto 1fr;
      justify-content: center;
      align-content: center;
      column-gap: 18px;
      row-gap: 8px;
    }
    header { grid-area: header; width: auto; }
    #hud { grid-area: hud; width: auto; flex-direction: column; align-items: flex-start; gap: 4px; }
    #lives { justify-content: flex-start; }
    #wrap { grid-area: wrap; align-self: center; }
    #touch { grid-area: touch; width: auto; align-self: center; }
    #dpad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 6px; }
    .tbtn { font-size: 18px; }
    footer { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>PAC-MAN</h1>
  <button id="btnMute" class="icon" aria-label="サウンドの切り替え" title="サウンド (M)">🔊</button>
</header>

<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div>LEVEL <span id="level">1</span></div>
  <div>HIGH <span id="high">0</span></div>
  <div id="lives" aria-label="残機"></div>
</div>

<div id="wrap">
  <canvas id="game" width="560" height="620" role="img" aria-label="パックマンのゲーム画面"></canvas>
  <div id="overlay" aria-live="polite">
    <div class="big" id="ovTitle">READY?</div>
    <div id="ovText">タップ / SPACE でスタート</div>
    <div id="diffPick" role="group" aria-label="難易度">
      <button class="dbtn" data-diff="easy" aria-pressed="false">EASY</button>
      <button class="dbtn" data-diff="normal" aria-pressed="true">NORMAL</button>
      <button class="dbtn" data-diff="hard" aria-pressed="false">HARD</button>
    </div>
    <div class="small" id="ovHint">矢印キー / WASD / スワイプで移動　P：ポーズ　R：リスタート　M：ミュート</div>
  </div>
</div>

<div id="touch">
  <div id="dpad">
    <button class="tbtn" data-dir="up" aria-label="上">▲</button>
    <button class="tbtn restart" id="btnRestart" aria-label="リスタート">⟳</button>
    <button class="tbtn" data-dir="left" aria-label="左">◀</button>
    <button class="tbtn action" id="btnAction" aria-label="スタート / ポーズ">▶</button>
    <button class="tbtn" data-dir="right" aria-label="右">▶</button>
    <button class="tbtn" data-dir="down" aria-label="下">▼</button>
  </div>
</div>

<footer>パワーエサでゴーストを食べられる（200 → 400 → 800 → 1600 点）／ フルーツで追加ボーナス ／ 10000 点で 1UP</footer>

<script>
(() => {
"use strict";

const TEST = location.hash === "#test";
// 「視覚効果を減らす」設定の人には、迷路・パワーエサ・イジケ終了の点滅を出さない
const REDUCE_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------------------------------------------------------- 安全なストレージ
// 隔離された iframe などでは localStorage が例外を投げることがある
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { /* 保存できなくても続行 */ }
  },
};

// ---------------------------------------------------------------- 迷路データ
// # 壁 / X 表示しない壁 / . エサ / o パワーエサ / - ゴーストの巣の扉 / 空白 通路
const MAZE = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "XXXXX#.##### ## #####.#XXXXX",
  "XXXXX#.##          ##.#XXXXX",
  "XXXXX#.## ###--### ##.#XXXXX",
  "######.## #      # ##.######",
  "      .   #      #   .      ",
  "######.## #      # ##.######",
  "XXXXX#.## ######## ##.#XXXXX",
  "XXXXX#.##          ##.#XXXXX",
  "XXXXX#.## ######## ##.#XXXXX",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##................##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################",
];

const COLS = 28, ROWS = 31, TILE = 20;
const W = COLS * TILE, H = ROWS * TILE;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 高解像度ディスプレイでもくっきり描画する
const DPR = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = Math.round(W * DPR);
canvas.height = Math.round(H * DPR);

const wrapCol = c => ((c % COLS) + COLS) % COLS;
function tileAt(c, r) {
  if (r < 0 || r >= ROWS) return "#";
  return MAZE[r][wrapCol(c)];
}
function isWall(c, r, doorOpen) {
  const t = tileAt(c, r);
  if (t === "#" || t === "X") return true;
  if (t === "-") return !doorOpen;
  return false;
}

// ---------------------------------------------------------------- 状態
const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y:  1 },
  left:  { x: -1, y: 0 },
  right: { x: 1,  y: 0 },
};
const DIR_LIST = ["up", "left", "down", "right"];
const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

const HOUSE = { c: 13, r: 14 };      // 巣の中心
const DOOR_OUT = { c: 13, r: 11 };   // 巣の出口（扉の上）
const FRUIT_POS = { x: 14 * TILE, y: 17.5 * TILE };
const FRUIT_SPAWN_AT = [70, 170];    // 食べたエサの数
const FRUIT_POINTS = [100, 300, 500, 500, 700, 700, 1000, 1000, 2000, 2000, 3000, 3000, 5000];
const EXTRA_LIFE_AT = 10000;
const ELROY_AT = 20;
const CORNER_SLACK = 0.3;            // 角を通り過ぎてからも曲がれる猶予（タイル単位）

// 難易度：残機・ゴーストの速さ(倍率)・パワーエサの効果時間(秒)が変わる。ハイスコアは難易度別に保存
const DIFFS = {
  easy:   { label: "EASY",   lives: 5, speed: 0.85, fright: 10 },
  normal: { label: "NORMAL", lives: 3, speed: 1,    fright: 8 },
  hard:   { label: "HARD",   lives: 2, speed: 1.12, fright: 5 },
};
const highKey = d => d === "normal" ? "pacman-high" : "pacman-high-" + d;
const INIT_DIFF = DIFFS[store.get("pacman-diff", "normal")] ? store.get("pacman-diff", "normal") : "normal";

const state = {
  score: 0,
  difficulty: INIT_DIFF,
  high: Number(store.get(highKey(INIT_DIFF), 0)) || 0,
  level: 1,
  lives: 3,
  phase: "title",   // title | ready | play | dying | levelclear | gameover | paused
  timer: 0,
  freeze: 0,
  ghostCombo: 0,
  extraLife: false,
  muted: store.get("pacman-muted", "0") === "1",
  startHigh: 0,
};

let grid, pelletsLeft, totalPellets, fruit, fruitSpawned;
let pac, ghosts, modeTimer, modeIndex, frightTimer, clock = 0;
const popups = [];

const SCATTER_CHASE = [7, 20, 7, 20, 5, 20, 5, Infinity]; // 秒（偶数番目が散開）

function makePac() {
  return { c: 13, r: 23, dir: "left", want: "left", prog: 0, mouth: 0, dead: 0, blocked: false };
}

function makeGhost(name, color, scatter, c, r, releaseAt) {
  return {
    name, color, scatter,
    c, r,
    dir: "up", prog: 0,
    mode: releaseAt > 0 ? "house" : "out",  // house | out | eyes
    release: releaseAt,
    blocked: false,
  };
}

function resetActors() {
  pac = makePac();
  ghosts = [
    makeGhost("blinky", "#ff0000", { c: 25, r: -2 }, 13, 11, 0),
    makeGhost("pinky",  "#ffb8ff", { c: 2,  r: -2 }, 13, 14, 1.5),
    makeGhost("inky",   "#00ffff", { c: 27, r: 31 }, 11, 14, 5),
    makeGhost("clyde",  "#ffb851", { c: 0,  r: 31 }, 16, 14, 9),
  ];
  ghosts[0].dir = "left";
  modeTimer = 0;
  modeIndex = 0;
  frightTimer = 0;
  fruit = null;
  state.ghostCombo = 0;
  state.freeze = 0;
}

function resetLevel() {
  grid = MAZE.map(row => row.split(""));
  pelletsLeft = 0;
  for (const row of grid) for (const ch of row) if (ch === "." || ch === "o") pelletsLeft++;
  totalPellets = pelletsLeft;
  fruitSpawned = 0;
  popups.length = 0;
  resetActors();
}

function newGame() {
  state.score = 0;
  state.level = 1;
  state.lives = DIFFS[state.difficulty].lives;
  state.ghostCombo = 0;
  state.extraLife = false;
  state.startHigh = state.high;
  resetLevel();
  setPhase("ready", 2.2);
  sfx.start();
}

function setPhase(p, seconds = 0) {
  state.phase = p;
  state.timer = seconds;
  updateOverlay();
  setWakeLock(p === "ready" || p === "play" || p === "dying" || p === "levelclear");
}

// プレイ中はスマホの画面が暗くならないようにする（非対応環境では何もしない）
let wakeLock = null;
async function setWakeLock(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      const lock = wakeLock;
      wakeLock = null;
      await lock.release();
    }
  } catch (e) { wakeLock = null; }
}

// ---------------------------------------------------------------- 効果音（WebAudio）
const audio = { ctx: null, master: null, flip: false };
function ensureAudio() {
  try {
    if (!audio.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audio.ctx = new AC();
      audio.master = audio.ctx.createGain();
      audio.master.gain.value = state.muted ? 0 : 0.7;
      audio.master.connect(audio.ctx.destination);
    }
    if (audio.ctx.state === "suspended") audio.ctx.resume();
  } catch (e) { /* 音が出せない環境は無視 */ }
}
function tone(freq, dur, opt = {}) {
  if (!audio.ctx || state.muted) return;
  try {
    const t0 = audio.ctx.currentTime + (opt.delay || 0);
    const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
    o.type = opt.type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, t0 + dur);
    g.gain.setValueAtTime(opt.gain || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audio.master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  } catch (e) { /* 無視 */ }
}
const sfx = {
  waka() { audio.flip = !audio.flip; tone(audio.flip ? 520 : 380, 0.05, { gain: 0.045 }); },
  power() { tone(160, 0.3, { to: 90, gain: 0.06 }); },
  eatGhost() { tone(300, 0.22, { to: 1000, gain: 0.06 }); },
  fruit() { tone(880, 0.08); tone(1320, 0.14, { delay: 0.08 }); },
  death() { tone(620, 1.2, { to: 60, type: "sawtooth", gain: 0.06 }); },
  extra() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, { delay: i * 0.1 })); },
  clear() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.14, { delay: i * 0.12 })); },
  start() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.16, { delay: i * 0.14, gain: 0.04 })); },
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 無視 */ } }

function setMuted(m) {
  state.muted = m;
  store.set("pacman-muted", m ? "1" : "0");
  if (audio.master) audio.master.gain.value = m ? 0 : 0.7;
  document.getElementById("btnMute").textContent = m ? "🔇" : "🔊";
}

// ---------------------------------------------------------------- 入力
// 方向入力・開始/ポーズ・リスタートは、キーボード／十字ボタン／スワイプの
// どこから来ても同じ処理を通す。
function handleDir(dir) {
  pac.want = dir;
  if (state.phase !== "play") return;
  // 逆方向は通路の途中でも即座に反転できる
  if (dir === OPPOSITE[pac.dir]) { reverse(pac); return; }
  // 曲がり角を少し通り過ぎた直後でも、入力を受け付けて角に戻って曲がる（コーナリング猶予）
  if (dir !== pac.dir && !pac.blocked && pac.prog > 0 && pac.prog <= CORNER_SLACK) {
    const d = DIRS[dir];
    if (!isWall(pac.c + d.x, pac.r + d.y, false)) { pac.prog = 0; pac.dir = dir; }
  }
}
function handleAction() {
  if (state.phase === "title" || state.phase === "gameover") newGame();
  else if (state.phase === "play") setPhase("paused");
  else if (state.phase === "paused") setPhase("play");
}
function handleRestart() { newGame(); }
// 難易度はスタート前（タイトル／ゲームオーバー）だけ変更できる
function setDifficulty(d) {
  if (!DIFFS[d] || (state.phase !== "title" && state.phase !== "gameover")) return;
  state.difficulty = d;
  store.set("pacman-diff", d);
  state.high = Number(store.get(highKey(d), 0)) || 0;
  updateOverlay();
}
function handlePause() {
  if (state.phase === "play") setPhase("paused");
  else if (state.phase === "paused") setPhase("play");
}

const keyMap = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right",
  w: "up", s: "down", a: "left", d: "right",
};
addEventListener("keydown", e => {
  ensureAudio();
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key && e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const dir = keyMap[e.code] || keyMap[k];
  if (dir) { e.preventDefault(); handleDir(dir); return; }
  if (e.repeat) return;
  if (e.code === "Space" || k === " ") { e.preventDefault(); handleAction(); }
  else if (e.code === "KeyR" || k === "r") handleRestart();
  else if (e.code === "KeyP" || k === "p") handlePause();
  else if (e.code === "KeyM" || k === "m") setMuted(!state.muted);
  else if (e.code === "Digit1" || e.code === "Numpad1" || k === "1") setDifficulty("easy");
  else if (e.code === "Digit2" || e.code === "Numpad2" || k === "2") setDifficulty("normal");
  else if (e.code === "Digit3" || e.code === "Numpad3" || k === "3") setDifficulty("hard");
});
// iOS Safari は pointerdown では音声が解除されないことがあるため、touchend / click でも試す
for (const type of ["pointerdown", "touchend", "click"]) addEventListener(type, ensureAudio, { capture: true });

// ---------------------------------------------------------------- タッチ操作（スマホ対応）
addEventListener("touchstart", () => document.documentElement.classList.add("touch"), { once: true, passive: true });

document.querySelectorAll("#dpad [data-dir]").forEach(btn => {

// 盤面上のスワイプ：指が一定距離動いた瞬間に方向転換し、起点を更新して連続入力も可能。
// ほぼ動かさずに離した場合はタップ＝スタート/ポーズ。
const SWIPE_MIN = 22;
const wrapEl = document.getElementById("wrap");
let swipe = null;
wrapEl.addEventListener("pointerdown", e => {
  swipe = { x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
  try { wrapEl.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
});
wrapEl.addEventListener("pointermove", e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.hypot(dx, dy) < SWIPE_MIN) return;
  swipe.moved = true;
  swipe.x = e.clientX; swipe.y = e.clientY;
  handleDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
function endSwipe(e) {
  if (!swipe || e.pointerId !== swipe.id) return;
  const wasTap = !swipe.moved;
  swipe = null;
  if (wasTap && e.type === "pointerup") handleAction();
}
wrapEl.addEventListener("pointerup", endSwipe);
wrapEl.addEventListener("pointercancel", endSwipe);

// ゲームパッド：十字キー/左スティックで移動、A（Start）ボタンでスタート/ポーズ
const pad = { action: false };
function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    const btn = i => !!(p.buttons[i] && p.buttons[i].pressed);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const dir = (btn(12) || ay < -0.5) ? "up" : (btn(13) || ay > 0.5) ? "down"
              : (btn(14) || ax < -0.5) ? "left" : (btn(15) || ax > 0.5) ? "right" : null;
    if (dir) handleDir(dir);
    const action = btn(0) || btn(9);
    if (action && !pad.action) handleAction();
    pad.action = action;
  }
}

// ---------------------------------------------------------------- 移動処理
// 各キャラは「タイル(c,r) + 進行度 prog(0..1)」で位置を持ち、
// タイル中心に到達したときだけ進路を決める。
// 進行方向を反転する（タイル途中でも位置がずれないように付け替える）
function reverse(actor) {
  const d = DIRS[actor.dir];
  if (!actor.blocked && actor.prog > 0) {
    actor.c = wrapCol(actor.c + d.x);
    actor.r += d.y;
    actor.prog = 1 - actor.prog;
  }
  actor.dir = OPPOSITE[actor.dir];
  actor.blocked = false;
}

function step(actor, speed, dt, onArrive, canPassDoor) {
  // 壁に突き当たって停止中でも、進路の再判断は毎フレーム行う
  if (actor.blocked) {
    onArrive(actor);
    const d = DIRS[actor.dir];
    if (isWall(actor.c + d.x, actor.r + d.y, canPassDoor)) return;
    actor.blocked = false;
  }
  let move = speed * dt;
  while (move > 0) {
    const remain = 1 - actor.prog;
    if (move < remain) { actor.prog += move; break; }
    move -= remain;
    const d = DIRS[actor.dir];
    actor.c = wrapCol(actor.c + d.x);
    actor.r += d.y;
    actor.prog = 0;
    onArrive(actor);
    const nd = DIRS[actor.dir];
    if (isWall(actor.c + nd.x, actor.r + nd.y, canPassDoor)) { actor.blocked = true; break; }
  }
}

function pacArrive() {
  const cell = grid[pac.r][pac.c];
  if (cell === ".") {
    grid[pac.r][pac.c] = " ";
    pelletsLeft--;
    addScore(10);
    sfx.waka();
    onPelletEaten();
  } else if (cell === "o") {
    grid[pac.r][pac.c] = " ";
    pelletsLeft--;
    addScore(50);
    frightTimer = Math.max(2, DIFFS[state.difficulty].fright - (state.level - 1) * 0.6);
    state.ghostCombo = 0;
    for (const g of ghosts) if (g.mode === "out") reverse(g);
    sfx.power();
    onPelletEaten();
  }
  // 曲がれるなら希望方向へ
  const w = DIRS[pac.want];
  if (!isWall(pac.c + w.x, pac.r + w.y, false)) pac.dir = pac.want;
}

function onPelletEaten() {
  const eaten = totalPellets - pelletsLeft;
  if (fruitSpawned < FRUIT_SPAWN_AT.length && eaten >= FRUIT_SPAWN_AT[fruitSpawned]) {
    fruitSpawned++;
    fruit = { t: 9.5 };
  }
}

// ---------------------------------------------------------------- ゴーストAI
function ghostTarget(g) {
  if (g.mode === "eyes") return HOUSE;
  if (g.mode === "house") return DOOR_OUT;
  if (frightTimer > 0) return null;                 // ランダム移動
  const elroy = g.name === "blinky" && pelletsLeft <= ELROY_AT;
  if (modeIndex % 2 === 0 && !elroy) return g.scatter;

  const pd = DIRS[pac.dir];
  switch (g.name) {
    case "blinky":
      return { c: pac.c, r: pac.r };
    case "pinky":
      return { c: pac.c + pd.x * 4, r: pac.r + pd.y * 4 };
    case "inky": {
      const b = ghosts[0];
      const px = pac.c + pd.x * 2, py = pac.r + pd.y * 2;
      return { c: px * 2 - b.c, r: py * 2 - b.r };
    }
    default: { // clyde: 近づきすぎたら自分のコーナーへ
      const dist = Math.hypot(g.c - pac.c, g.r - pac.r);
      return dist > 8 ? { c: pac.c, r: pac.r } : g.scatter;
    }
  }
}

function ghostArrive(g) {
  if (g.mode === "eyes" && g.c === HOUSE.c && g.r === HOUSE.r) {
    g.mode = "house";
    g.release = 0.6;
  } else if (g.mode === "house" && g.r === DOOR_OUT.r && g.c === DOOR_OUT.c) {
    g.mode = "out";
  }
  chooseGhostDir(g);
}

function chooseGhostDir(g) {
  const doorOpen = g.mode !== "out";
  const target = ghostTarget(g);
  const options = [];
  for (const dir of DIR_LIST) {
    if (dir === OPPOSITE[g.dir]) continue;           // 反転は禁止
    const d = DIRS[dir];
    if (isWall(g.c + d.x, g.r + d.y, doorOpen)) continue;
    options.push(dir);
  }
  if (options.length === 0) { g.dir = OPPOSITE[g.dir]; return; }
  if (!target) {                                     // イジケ中はランダム
    g.dir = options[(Math.random() * options.length) | 0];
    return;
  }
  let best = options[0], bestD = Infinity;
  for (const dir of options) {
    const d = DIRS[dir];
    const dc = g.c + d.x - target.c, dr = g.r + d.y - target.r;
    const dist = dc * dc + dr * dr;
    if (dist < bestD) { bestD = dist; best = dir; }
  }
  g.dir = best;
}

function ghostSpeed(g) {
  const base = Math.min(6.2 + (state.level - 1) * 0.25, 9) * DIFFS[state.difficulty].speed;
  if (g.mode === "eyes") return 15;
  if (g.mode === "house") return 4;
  let s = base;
  if (frightTimer > 0) s = base * 0.55;
  else if (g.name === "blinky") s = base * (pelletsLeft <= ELROY_AT / 2 ? 1.1 : pelletsLeft <= ELROY_AT ? 1.05 : 1);
  if (g.r === 14 && (g.c <= 5 || g.c >= 22)) s *= 0.55; // ワープトンネルでは減速
  return s;
}

// ---------------------------------------------------------------- 更新
function addScore(n) {
  state.score += n;
  if (state.score > state.high) {
    state.high = state.score;
    store.set(highKey(state.difficulty), state.high);
  }
  if (!state.extraLife && state.score >= EXTRA_LIFE_AT) {
    state.extraLife = true;
    state.lives++;
    sfx.extra();
    popups.push({ x: W / 2, y: 17.5 * TILE, text: "1UP", t: 1.4, color: "#ffd23f" });
  }
}

function actorPos(a) {
  const d = DIRS[a.dir];
  const p = a.blocked ? 0 : a.prog;
  return { x: (a.c + 0.5 + d.x * p) * TILE, y: (a.r + 0.5 + d.y * p) * TILE };
}

function collide() {
  const p = actorPos(pac);
  for (const g of ghosts) {
    if (g.mode === "eyes") continue;
    const q = actorPos(g);
    if (Math.hypot(p.x - q.x, p.y - q.y) > TILE * 0.7) continue;
    if (frightTimer > 0) {
      state.ghostCombo = Math.min(state.ghostCombo + 1, 4);
      const pts = 200 * Math.pow(2, state.ghostCombo - 1);
      addScore(pts);
      popups.push({ x: q.x, y: q.y, text: String(pts), t: 1, color: "#58e8ff" });
      g.mode = "eyes";
      g.blocked = false;
      state.freeze = 0.4;
      sfx.eatGhost();
      buzz(25);
    } else {
      setPhase("dying", 1.8);
      sfx.death();
      buzz(120);
      return;
    }
  }
}

function checkFruit(dt) {
  if (!fruit) return;
  fruit.t -= dt;
  if (fruit.t <= 0) { fruit = null; return; }
  const p = actorPos(pac);
  if (Math.hypot(p.x - FRUIT_POS.x, p.y - FRUIT_POS.y) < TILE * 0.8) {
    const pts = FRUIT_POINTS[Math.min(state.level - 1, FRUIT_POINTS.length - 1)];
    addScore(pts);
    popups.push({ x: FRUIT_POS.x, y: FRUIT_POS.y, text: String(pts), t: 1.2, color: "#ffb8ff" });
    fruit = null;
    sfx.fruit();
  }
}

function update(dt) {
  clock += dt;
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t -= dt;
    if (popups[i].t <= 0) popups.splice(i, 1);
  }

  if (state.phase === "ready" || state.phase === "levelclear" || state.phase === "dying") {
    state.timer -= dt;
    if (state.phase === "dying") pac.dead += dt;
    if (state.timer <= 0) {
      if (state.phase === "ready") setPhase("play");
      else if (state.phase === "levelclear") {
        state.level++;
        resetLevel();
        setPhase("ready", 1.8);
      } else { // dying
        state.lives--;
        if (state.lives <= 0) setPhase("gameover");
        else { resetActors(); setPhase("ready", 1.8); }
      }
    }
    return;
  }
  if (state.phase !== "play") return;

  // ゴースト撃破直後の一瞬の停止
  if (state.freeze > 0) { state.freeze -= dt; return; }

  // モード（追跡／散開）タイマー
  if (frightTimer > 0) {
    frightTimer -= dt;
    if (frightTimer <= 0) state.ghostCombo = 0;
  } else {
    modeTimer += dt;
    if (modeTimer >= SCATTER_CHASE[modeIndex]) {
      modeTimer = 0;
      modeIndex = Math.min(modeIndex + 1, SCATTER_CHASE.length - 1);
      for (const g of ghosts) if (g.mode === "out") reverse(g);
    }
  }

  pac.mouth += dt * 12;
  step(pac, 7 + (state.level - 1) * 0.15, dt, pacArrive, false);
  checkFruit(dt);

  for (const g of ghosts) {
    if (g.mode === "house" && g.release > 0) {
      g.release -= dt;
      g.dir = (Math.floor(clock / 0.4) % 2) ? "up" : "down"; // 巣の中で上下を見る
      continue;
    }
    step(g, ghostSpeed(g), dt, ghostArrive, g.mode !== "out");
  }

  collide();

  if (state.phase === "play" && pelletsLeft === 0) {
    fruit = null;
    setPhase("levelclear", 2);
    sfx.clear();
  }
}

// ---------------------------------------------------------------- 描画
// 迷路は変化しないので、オフスクリーンに一度だけ描いて毎フレーム貼り付ける
function makeMazeLayer(color) {
  const layer = document.createElement("canvas");
  layer.width = canvas.width;
  layer.height = canvas.height;
  const g = layer.getContext("2d");
  g.scale(DPR, DPR);
  g.lineWidth = 2;
  g.strokeStyle = color;
  g.lineCap = "round";
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAZE[r][c] !== "#") continue;
      const x = c * TILE, y = r * TILE;
      const open = (dc, dr) => {
        const n = tileAt(c + dc, r + dr);
        return n !== "#" && n !== "X";
      };
      g.beginPath();
      if (open(0, -1)) { g.moveTo(x + 1, y + 1); g.lineTo(x + TILE - 1, y + 1); }
      if (open(0,  1)) { g.moveTo(x + 1, y + TILE - 1); g.lineTo(x + TILE - 1, y + TILE - 1); }
      if (open(-1, 0)) { g.moveTo(x + 1, y + 1); g.lineTo(x + 1, y + TILE - 1); }
      if (open( 1, 0)) { g.moveTo(x + TILE - 1, y + 1); g.lineTo(x + TILE - 1, y + TILE - 1); }
      g.stroke();
    }
  }
  g.strokeStyle = "#ff9ecb";
  g.lineWidth = 3;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAZE[r][c] !== "-") continue;
      g.beginPath();
      g.moveTo(c * TILE, r * TILE + TILE / 2);
      g.lineTo(c * TILE + TILE, r * TILE + TILE / 2);
      g.stroke();
    }
  }
  return layer;
}
const mazeBlue = makeMazeLayer("#2b4cff");
const mazeWhite = makeMazeLayer("#ffffff");

function drawPellets(time) {
  const blink = REDUCE_MOTION || Math.sin(time * 8) > -0.4;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (t === ".") {
        ctx.fillStyle = "#ffd9a8";
        ctx.beginPath();
        ctx.arc((c + .5) * TILE, (r + .5) * TILE, 2.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (t === "o" && (blink || state.phase !== "play")) {
        ctx.fillStyle = "#ffe9c0";
        ctx.beginPath();
        ctx.arc((c + .5) * TILE, (r + .5) * TILE, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawFruit(level, x, y) {
  const k = level <= 1 ? 0 : level === 2 ? 1 : level <= 4 ? 2 : level <= 6 ? 3 : level <= 8 ? 4 : 5;
  ctx.save();
  ctx.translate(x, y);
  ctx.lineWidth = 1.6;
  const stem = (x1, y1, x2, y2, col = "#3fbf3f") => {
    ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  };
  const ball = (cx, cy, r, col) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  };
  switch (k) {
    case 0: // さくらんぼ
      stem(-3.5, 3, 1, -7, "#7ad37a"); stem(3.5, 3, 1, -7, "#7ad37a");
      ball(-4, 4.5, 4.2, "#ff2a2a"); ball(4, 4.5, 4.2, "#ff2a2a");
      ball(-5.2, 3.2, 1.1, "#ffb3b3"); ball(2.8, 3.2, 1.1, "#ffb3b3");
      break;
    case 1: // いちご
      ctx.fillStyle = "#ff3355";
      ctx.beginPath(); ctx.moveTo(-6.5, -3); ctx.quadraticCurveTo(0, -6, 6.5, -3);
      ctx.quadraticCurveTo(5, 6, 0, 8); ctx.quadraticCurveTo(-5, 6, -6.5, -3); ctx.fill();
      ctx.fillStyle = "#3fbf3f"; ctx.fillRect(-4.5, -6, 9, 2.6);
      ctx.fillStyle = "#ffe9a8";
      [[-2.5, 0], [2.5, 0], [0, 3], [-2.5, 4.5], [2.5, 4.5]].forEach(([sx, sy]) => ctx.fillRect(sx - .6, sy, 1.3, 1.3));
      break;
    case 2: // オレンジ
      ball(0, 1.5, 6.5, "#ff9a1f"); stem(0, -5, 0, -7.5);
      ctx.fillStyle = "#3fbf3f"; ctx.fillRect(0, -8, 4, 2.4);
      break;
    case 3: // りんご
      ball(-2.8, 1.8, 5, "#ff2a2a"); ball(2.8, 1.8, 5, "#ff2a2a");
      stem(0, -3, 1.5, -7, "#a06a2a");
      break;
    case 4: // メロン
      ball(0, 1, 6.8, "#4fd16a");
      ctx.strokeStyle = "#c9f7c9"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-5, -2); ctx.lineTo(5, 4); ctx.moveTo(-5, 3); ctx.lineTo(5, -3);
      ctx.moveTo(0, -5); ctx.lineTo(0, 7); ctx.stroke();
      break;
    default: // カギ
      ctx.strokeStyle = "#58e8ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -4, 3.2, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -0.8); ctx.lineTo(0, 8); ctx.moveTo(0, 5); ctx.lineTo(3.5, 5);
      ctx.moveTo(0, 8); ctx.lineTo(3.5, 8); ctx.stroke();
  }
  ctx.restore();
}

function drawPac() {
  const { x, y } = actorPos(pac);
  const angle = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[pac.dir];
  let open;
  if (state.phase === "dying") {
    open = Math.min(Math.PI, pac.dead * 2.2); // 死亡アニメ：口が開いて消える
    if (open >= Math.PI) return;
  } else {
    open = state.phase === "play" ? (Math.abs(Math.sin(pac.mouth)) * 0.32 + 0.02) * Math.PI : 0.2 * Math.PI;
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = "#ffe135";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, TILE * 0.46, open, Math.PI * 2 - open);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawGhost(g, time) {
  const { x, y } = actorPos(g);
  const R = TILE * 0.46;
  const fright = frightTimer > 0 && g.mode !== "eyes";
  const flash = !REDUCE_MOTION && fright && frightTimer < 2 && Math.sin(time * 18) > 0;

  if (g.mode !== "eyes") {
    ctx.fillStyle = fright ? (flash ? "#ffffff" : "#2222dd") : g.color;
    ctx.beginPath();
    ctx.arc(x, y - R * 0.1, R, Math.PI, 0);
    ctx.lineTo(x + R, y + R * 0.75);
    // 裾のギザギザ（足が交互に動く）
    const feet = 3, w = (R * 2) / feet, wob = Math.floor(time * 8) % 2;
    for (let i = 0; i < feet; i++) {
      const fx = x + R - i * w;
      ctx.quadraticCurveTo(fx - w / 2, y + R * 0.75 - (((i + wob) % 2) ? 6 : -4), fx - w, y + R * 0.75);
    }
    ctx.closePath();
    ctx.fill();
  }

  const d = DIRS[g.dir];
  if (fright && !flash) {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x - 4, y - 3, 2.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 4, y - 3, 2.4, 0, 7); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = -6; i <= 6; i += 3) ctx.lineTo(x + i, y + 5 + (i % 6 === 0 ? 0 : -3));
    ctx.stroke();
    return;
  }
  // 目
  for (const sx of [-4.5, 4.5]) {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(x + sx, y - 2, 3.4, 4.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#1a1aff";
    ctx.beginPath(); ctx.arc(x + sx + d.x * 1.6, y - 2 + d.y * 2, 1.9, 0, 7); ctx.fill();
  }
}

function drawPopups() {
  ctx.font = "bold 13px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.t * 2.5);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - (1 - Math.min(p.t, 1)) * 14);
  }
  ctx.globalAlpha = 1;
}

function draw(time) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const flashWhite = !REDUCE_MOTION && state.phase === "levelclear" && Math.floor(state.timer * 4) % 2 === 0;
  ctx.drawImage(flashWhite ? mazeWhite : mazeBlue, 0, 0, W, H);
  drawPellets(time);
  if (fruit) drawFruit(state.level, FRUIT_POS.x, FRUIT_POS.y);
  // 左右のワープ通路で端にまたがるキャラは、反対側にも同じ姿を描いて途切れさせない
  const copies = a => { const x = actorPos(a).x; return x < TILE ? [0, W] : x > W - TILE ? [0, -W] : [0]; };
  const drawAt = (a, fn) => { for (const dx of copies(a)) { ctx.save(); ctx.translate(dx, 0); fn(); ctx.restore(); } };
  drawAt(pac, drawPac);
  if (state.phase !== "dying" && state.phase !== "levelclear") for (const g of ghosts) drawAt(g, () => drawGhost(g, time));
  drawPopups();
}

const el = {
  score: document.getElementById("score"),
  level: document.getElementById("level"),
  high: document.getElementById("high"),
  lives: document.getElementById("lives"),
  overlay: document.getElementById("overlay"),
  ovTitle: document.getElementById("ovTitle"),
  ovText: document.getElementById("ovText"),
  ovHint: document.getElementById("ovHint"),
  btnAction: document.getElementById("btnAction"),
  diffPick: document.getElementById("diffPick"),
};
const hudCache = {};
function setText(node, key, value) {
  if (hudCache[key] !== value) { hudCache[key] = value; node.textContent = value; }
}

function updateHud() {
  setText(el.score, "score", state.score);
  setText(el.level, "level", state.level);
  setText(el.high, "high", state.high);
  const lives = Math.max(0, state.lives);
  if (el.lives.childElementCount !== lives) {
    el.lives.innerHTML = "";
    for (let i = 0; i < lives; i++) {
      const d = document.createElement("div");
      d.className = "life";
      el.lives.appendChild(d);
    }
  }
}

const HINT_KEYS = "矢印キー / WASD で移動　P：ポーズ　R：リスタート　M：ミュート　1/2/3：難易度";
const HINT_TOUCH = "スワイプ / 十字ボタンで移動　⟳：リスタート";
function updateOverlay() {
  const show = (title, text, hint = "") => {
    el.overlay.classList.remove("hidden");
    el.ovTitle.textContent = title;
    el.ovText.textContent = text;
    el.ovHint.textContent = hint;
    el.ovHint.style.display = hint ? "" : "none";
  };
  const touch = matchMedia("(pointer: coarse)").matches || document.documentElement.classList.contains("touch");
  switch (state.phase) {
    case "title":      show("PAC-MAN", "タップ / SPACE でスタート", touch ? HINT_TOUCH : HINT_KEYS); break;
    case "ready":      show("READY!", DIFFS[state.difficulty].label + "　" + state.lives + " 機のこり"); break;
    case "paused":     show("PAUSE", "タップ / SPACE / P で再開"); break;
    case "gameover": {
      const record = state.score > state.startHigh;
      show("GAME OVER", (record ? "NEW HIGH SCORE  " : "SCORE ") + state.score, "タップ / SPACE でもう一度");
      break;
    }
    case "levelclear": show("LEVEL " + state.level + " CLEAR!", "次のレベルへ"); break;
    default:           el.overlay.classList.add("hidden");
  }
  el.btnAction.textContent = (state.phase === "play") ? "⏸" : "▶";
  el.diffPick.style.display = (state.phase === "title" || state.phase === "gameover") ? "" : "none";
  el.diffPick.querySelectorAll("[data-diff]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.diff === state.difficulty)));
}

// ---------------------------------------------------------------- メインループ
// 固定タイムステップ（1/120 秒）で更新し、描画はディスプレイのリフレッシュレートに従う
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (!TEST) {
    pollGamepad();
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  }
  draw(now / 1000);
  updateHud();
  requestAnimationFrame(loop);
}

setMuted(state.muted);
resetLevel();
setPhase("title");
updateHud();
requestAnimationFrame(loop);

// 自動テスト用フック（URL に #test を付けたときだけ公開。通常のゲームループは止まる）
if (TEST) {
  window.__pacman = {
    state, MAZE, STEP, popups, store,
    get pac() { return pac; },
    get ghosts() { return ghosts; },
    get grid() { return grid; },
    get fruit() { return fruit; },
    get frightTimer() { return frightTimer; },
    set frightTimer(v) { frightTimer = v; },
    get pelletsLeft() { return pelletsLeft; },
    set pelletsLeft(v) { pelletsLeft = v; },
    get totalPellets() { return totalPellets; },
    draw, DPR, DIFFS, setDifficulty, update, handleDir, handleAction, handleRestart, setPhase, newGame, resetLevel, actorPos, ghostSpeed, pollGamepad,
    tick(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) update(STEP); },
  };
}
})();
</script>
</body>
</html>
