<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAC-MAN 自動テスト</title>
<style>
  body { font: 14px/1.6 "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; margin: 24px; background: #0b0b1f; color: #e8e8ff; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #summary { margin: 0 0 16px; font-weight: 700; }
  .ok { color: #5be37d; } .ng { color: #ff6b6b; }
  ul { list-style: none; padding: 0; margin: 0; max-width: 720px; }
  li { padding: 4px 0; border-bottom: 1px solid #23237a; }
  small { color: #9c9cc8; display: block; }
  iframe { position: absolute; left: -9999px; width: 800px; height: 700px; }
</style>
</head>
<body>
<h1>PAC-MAN 自動テスト</h1>
<p id="summary">実行中…</p>
<ul id="list"></ul>
<iframe id="game" title="テスト対象"></iframe>

<script>
// index.html を #test モードで読み込み、公開されたフック(window.__pacman)で内部状態を直接検証する。
// 通常のゲームループは止まり、tick(秒) で時間を決定的に進められる。同一オリジン(http/https)で開くこと。
const frame = document.getElementById("game");
const list = document.getElementById("list");
let passed = 0, failed = 0;

function report(name, ok, detail) {
  ok ? passed++ : failed++;
  const li = document.createElement("li");
  li.innerHTML = `<span class="${ok ? "ok" : "ng"}">${ok ? "PASS" : "FAIL"}</span> ${name}` +
    (ok || detail === undefined ? "" : `<small>${JSON.stringify(detail)}</small>`);
  list.appendChild(li);
}

frame.addEventListener("load", () => {
  const win = frame.contentWindow;
  const P = win.__pacman;
  if (!P) { document.getElementById("summary").textContent = "テストフックが見つかりません（index.html#test を確認）"; return; }
  const doc = frame.contentDocument;
  const errors = [];
  win.addEventListener("error", e => errors.push(e.message));

  const t = (name, fn) => {
    try { const r = fn(); if (r === true || r === undefined) report(name, true); else report(name, false, r); }
    catch (e) { report(name, false, String(e)); }
  };
  const freshPlay = () => { P.newGame(); P.tick(2.5); P.frightTimer = 0; };
  const ghostOnPac = g => { g.c = P.pac.c; g.r = P.pac.r; g.prog = P.pac.prog; g.blocked = false; g.mode = "out"; };
  const isWall = (c, r) => { const ch = (r < 0 || r >= 31) ? "#" : P.MAZE[r][((c % 28) + 28) % 28]; return ch === "#" || ch === "X"; };
  const place = (c, r, prog, dir) => Object.assign(P.pac, { c, r, prog, dir, want: dir, blocked: false });

  t("タイトルから開始 → READY → プレイ", () => {
    P.handleAction(); if (P.state.phase !== "ready") return P.state.phase;
    P.tick(2.5); if (P.state.phase !== "play") return P.state.phase;
  });
  t("壁で停止してから曲がれる／エサで加点", () => {
    P.handleDir("left"); P.tick(1.6);
    if (!(P.pac.c === 6 && P.pac.r === 23 && P.pac.blocked && P.state.score === 70)) return [P.pac.c, P.pac.r, P.state.score];
    P.handleDir("up"); P.tick(1.0);
    if (!(P.pac.r === 16 && P.state.score === 140)) return [P.pac.r, P.state.score];
  });
  t("コーナリング猶予：角を0.2マス過ぎても曲がれる", () => {
    freshPlay(); P.frightTimer = 999; place(6, 5, 0.2, "left"); P.handleDir("down");
    if (!(P.pac.dir === "down" && P.pac.prog === 0)) return [P.pac.dir, P.pac.prog];
  });
  t("コーナリング猶予：0.6マス過ぎたら曲がらず入力を保持", () => {
    freshPlay(); P.frightTimer = 999; place(6, 5, 0.6, "left"); P.handleDir("down");
    if (!(P.pac.dir === "left" && P.pac.want === "down")) return [P.pac.dir, P.pac.want];
  });
  t("コーナリング猶予：壁の方向には曲がらない", () => {
    freshPlay(); P.frightTimer = 999; place(7, 5, 0.2, "left"); P.handleDir("up");
    if (P.pac.dir !== "left") return P.pac.dir;
  });
  t("イジケ中にゴーストを食べると +200 とポップアップ", () => {
    freshPlay(); P.frightTimer = 999; const b = P.ghosts[0]; ghostOnPac(b); const s0 = P.state.score; P.tick(0.05);
    if (!(b.mode === "eyes" && P.state.score - s0 === 200 && P.popups.length === 1)) return [b.mode, P.state.score - s0];
  });
  t("食べられたゴーストは 目玉 → 巣 → 復活 の順で戻る", () => {
    freshPlay(); P.frightTimer = 999; const b = P.ghosts[0]; ghostOnPac(b); P.tick(0.05);
    const seq = [b.mode];
    for (let i = 0; i < 1200 && b.mode !== "out"; i++) { P.tick(0.025); if (seq[seq.length - 1] !== b.mode) seq.push(b.mode); }
    if (seq.join() !== "eyes,house,out") return seq;
  });
  t("コンボ得点は 200→400→800→1600", () => {
    freshPlay(); P.frightTimer = 999; const got = [];
    for (let i = 0; i < 4; i++) { const g = P.ghosts[i]; ghostOnPac(g); const s = P.state.score; P.tick(0.05); P.state.freeze = 0; got.push(P.state.score - s); }
    if (got.join() !== "200,400,800,1600") return got;
  });
  t("フルーツ：70個で出現し、取ると100点", () => {
    freshPlay(); P.pelletsLeft = P.totalPellets - 69; P.tick(0.3); if (!P.fruit) return "not spawned";
    place(13, 17, 0, "left"); P.frightTimer = 999; const s = P.state.score; P.tick(0.1);
    if (!(P.state.score - s === 100 && !P.fruit)) return P.state.score - s;
  });
  t("フルーツは時間切れで消える", () => {
    freshPlay(); P.ghosts.forEach(g => { g.mode = "house"; g.release = 9999; });   // ゴーストを巣に留め、撃破の停止でタイマーが止まらないようにする
    P.pelletsLeft = P.totalPellets - 69; P.tick(0.3); if (!P.fruit) return "not spawned"; place(6, 5, 0, "right"); P.tick(10);
    if (P.fruit) return "still there";
  });
  t("10000点で1UP（1回だけ）", () => {
    freshPlay(); P.state.score = 9990; const l0 = P.state.lives; P.pelletsLeft = P.totalPellets - 1; P.tick(0.3);
    if (P.state.lives - l0 !== 1) return P.state.lives - l0;
    P.state.score = 30000; P.tick(0.2); if (P.state.lives - l0 !== 1) return "extra life repeated";
  });
  t("被弾で残機が減り、READY を経て復帰", () => {
    freshPlay(); ghostOnPac(P.ghosts[0]); P.tick(0.05); if (P.state.phase !== "dying") return P.state.phase;
    P.tick(2.0); if (!(P.state.phase === "ready" && P.state.lives === 2)) return [P.state.phase, P.state.lives];
    P.tick(2.0); if (P.state.phase !== "play") return P.state.phase;
  });
  t("残機ゼロでゲームオーバー（ハイスコア更新を表示）→ タップで再開", () => {
    freshPlay(); P.state.lives = 1; P.state.score = P.state.high + 500; P.state.high = P.state.score;
    ghostOnPac(P.ghosts[0]); P.tick(0.05); P.tick(2.0);
    if (P.state.phase !== "gameover") return P.state.phase;
    const txt = doc.getElementById("ovText").textContent; if (!txt.startsWith("NEW HIGH SCORE")) return txt;
    P.handleAction(); if (!(P.state.phase === "ready" && P.state.score === 0 && P.state.lives === 3)) return [P.state.phase, P.state.score, P.state.lives];
  });
  t("レベルクリアで次のレベルへ（エサが復元される）", () => {
    freshPlay(); P.pelletsLeft = 1; P.tick(0.5); if (P.state.phase !== "levelclear") return P.state.phase;
    P.tick(2.2); if (!(P.state.level === 2 && P.pelletsLeft === P.totalPellets)) return [P.state.level, P.pelletsLeft];
  });
  t("ノーミスボーナス：ミスせずクリアで+1000、ミスした場合は無し、次のレベルでは再び判定", () => {
    freshPlay(); const s0 = P.state.score; P.pelletsLeft = 0; P.tick(0.1);
    if (P.state.score - s0 !== 1000 || !P.state.perfect) return { gain: P.state.score - s0, perfect: P.state.perfect };
    P.tick(2.2);                                                       // レベル2へ
    P.tick(2.0); const g = P.ghosts[0]; g.mode = "out"; g.c = P.pac.c; g.r = P.pac.r; g.prog = 0; P.frightTimer = 0; P.tick(0.05);
    if (P.state.phase !== "dying") return "no death: " + P.state.phase;
    P.tick(3); P.tick(2.5);                                            // 復活して再開
    if (P.state.phase !== "play") return "not replaying: " + P.state.phase;
    const s1 = P.state.score; P.pelletsLeft = 0; P.tick(0.1);
    if (P.state.score !== s1 || P.state.perfect) return { gain: P.state.score - s1, perfect: P.state.perfect };
    P.tick(2.2);                                                       // レベル3：ミスなしに戻る
    P.tick(2.0); const s2 = P.state.score; P.pelletsLeft = 0; P.tick(0.1);
    if (P.state.score - s2 !== 1000) return { gain3: P.state.score - s2 };
  });
  t("ゴースト速度：トンネル/イジケで減速、Blinkyは終盤に加速", () => {
    freshPlay(); const g = P.ghosts[1]; g.mode = "out"; g.r = 5; g.c = 10; P.frightTimer = 0; const normal = P.ghostSpeed(g);
    g.r = 14; g.c = 2; const tunnel = P.ghostSpeed(g);
    g.r = 5; g.c = 10; P.frightTimer = 5; const fright = P.ghostSpeed(g); P.frightTimer = 0;
    const b = P.ghosts[0]; b.mode = "out"; b.r = 5; b.c = 10;
    P.pelletsLeft = 50; const e0 = P.ghostSpeed(b); P.pelletsLeft = 15; const e1 = P.ghostSpeed(b); P.pelletsLeft = 8; const e2 = P.ghostSpeed(b);
    if (!(tunnel < normal && fright < normal && e0 < e1 && e1 < e2)) return { normal, tunnel, fright, e0, e1, e2 };
  });
  t("ゲームパッド：十字キー/スティックで方向、Aボタンでポーズ切替", () => {
    freshPlay();
    let pads = [];
    Object.defineProperty(win.navigator, "getGamepads", { configurable: true, value: () => pads });
    const mk = (pressed = [], axes = [0, 0]) => ({ buttons: Array.from({ length: 16 }, (_, i) => ({ pressed: pressed.includes(i) })), axes });
    pads = [mk([13])]; P.pollGamepad(); if (P.pac.want !== "down") return ["dpad down", P.pac.want];
    pads = [mk([], [-0.9, 0])]; P.pollGamepad(); if (P.pac.want !== "left") return ["stick left", P.pac.want];
    pads = [mk([0])]; P.pollGamepad(); if (P.state.phase !== "paused") return ["A pause", P.state.phase];
    P.pollGamepad(); if (P.state.phase !== "paused") return "held button must not toggle again";
    pads = [mk([])]; P.pollGamepad(); pads = [mk([9])]; P.pollGamepad(); if (P.state.phase !== "play") return ["Start resume", P.state.phase];
    pads = [null]; P.pollGamepad();
  });
  t("ウィンドウがフォーカスを失うとポーズする（ポーズ中は進まない）", () => {
    freshPlay(); win.dispatchEvent(new win.Event("blur"));
    if (P.state.phase !== "paused") return P.state.phase;
    const s = P.state.score, c = P.pac.c; P.tick(2); if (P.state.score !== s || P.pac.c !== c) return "game advanced while paused";
    P.handleAction(); if (P.state.phase !== "play") return P.state.phase;
    P.state.phase = "title"; win.dispatchEvent(new win.Event("blur")); if (P.state.phase !== "title") return "blur must not change non-play phases";
  });
  t("ストレージが使えない環境でもゲームが動く（保存が例外を投げても続行）", () => {
    const proto = win.Storage.prototype, getI = proto.getItem, setI = proto.setItem;
    proto.getItem = () => { throw new Error("denied"); }; proto.setItem = () => { throw new Error("denied"); };
    try {
      if (P.store.get("pacman-high", 7) !== 7) return "get must return fallback";
      freshPlay(); P.state.high = 0; P.pelletsLeft = P.totalPellets - 1;
      P.handleDir("left"); P.tick(0.6);                      // エサを食べて加点 → ハイスコア保存を試みる
      if (!(P.state.score > 0 && P.state.high === P.state.score && P.state.phase !== "paused")) return [P.state.score, P.state.high];
    } finally { proto.getItem = getI; proto.setItem = setI; }
  });
  t("ワープ通路：端にまたがるパックマンが反対側にも描かれる（画素で確認）", () => {
    freshPlay(); P.frightTimer = 999;
    for (const g of P.ghosts) { g.c = 13; g.r = 5; }             // ゴーストは端から遠ざける
    const cv = doc.getElementById("game"), cx = cv.getContext("2d"), D = P.DPR;
    const yellow = (x0, x1) => {                                  // パックマンの黄色(255,225,53)の画素数
      const d = cx.getImageData(Math.round(x0 * D), Math.round(14 * 20 * D), Math.round((x1 - x0) * D), Math.round(20 * D)).data; let n = 0;
      for (let i = 0; i < d.length; i += 4) if (d[i] > 240 && d[i + 1] > 200 && d[i + 1] < 245 && d[i + 2] < 90) n++;
      return n;
    };
    place(27, 14, 0.5, "right"); P.pac.mouth = 0; P.draw(0);      // 右端ちょうどに中心
    const right = yellow(540, 560), left = yellow(0, 20);
    place(0, 14, 0, "left"); P.pac.prog = 0.5; P.draw(0);         // 左端から出ていく途中
    const left2 = yellow(0, 20), right2 = yellow(540, 560);
    if (!(right > 20 && left > 20 && left2 > 20 && right2 > 20)) return { right, left, left2, right2 };
  });
  const toNormal = () => { P.setPhase("title"); P.setDifficulty("normal"); };
  t("難易度：残機・ゴースト速度・パワーエサ時間が EASY < NORMAL < HARD の順に厳しくなる", () => {
    const r = {};
    for (const d of ["easy", "normal", "hard"]) {
      P.setPhase("title"); P.setDifficulty(d); P.newGame(); P.tick(2.5);
      const lives = P.state.lives; const g = P.ghosts[1]; g.mode = "out"; g.r = 5; g.c = 10; P.frightTimer = 0; const speed = P.ghostSpeed(g);
      place(1, 4, 0, "up"); P.tick(0.3);                           // パワーエサ(1,3)を食べる
      r[d] = { lives, speed: +speed.toFixed(2), fright: +P.frightTimer.toFixed(1) };
    }
    toNormal();
    const ok = r.easy.lives > r.normal.lives && r.normal.lives > r.hard.lives
      && r.easy.speed < r.normal.speed && r.normal.speed < r.hard.speed
      && r.easy.fright > r.normal.fright && r.normal.fright > r.hard.fright
      && r.normal.lives === 3 && r.normal.speed === 6.2;
    if (!ok) return r;
  });
  t("難易度：ハイスコアは難易度ごとに別々に保存・表示される", () => {
    const ls = win.localStorage; ls.removeItem("pacman-high"); ls.setItem("pacman-high-hard", "123"); ls.setItem("pacman-high-easy", "77");
    P.setPhase("title"); ls.setItem("pacman-high", "45");
    P.setDifficulty("hard"); const h = P.state.high;
    P.setDifficulty("easy"); const e = P.state.high;
    P.setDifficulty("normal"); const n = P.state.high;
    ls.removeItem("pacman-high-hard"); ls.removeItem("pacman-high-easy"); ls.removeItem("pacman-high");
    if (!(h === 123 && e === 77 && n === 45)) return { h, e, n };
  });
  t("難易度：プレイ中は変更できず、タイトルでは 1/2/3 キーとボタンで変更できる", () => {
    freshPlay(); P.setDifficulty("hard"); if (P.state.difficulty !== "normal") return "changed during play";
    P.setPhase("title");
    win.dispatchEvent(new win.KeyboardEvent("keydown", { code: "Digit3", key: "3" })); if (P.state.difficulty !== "hard") return ["key 3", P.state.difficulty];
    win.dispatchEvent(new win.KeyboardEvent("keydown", { code: "Digit1", key: "1" })); if (P.state.difficulty !== "easy") return ["key 1", P.state.difficulty];
    doc.querySelector('#diffPick [data-diff="normal"]').click(); if (P.state.difficulty !== "normal") return ["button", P.state.difficulty];
    const pressed = [...doc.querySelectorAll("#diffPick [data-diff]")].map(b => b.getAttribute("aria-pressed")).join();
    if (pressed !== "false,true,false") return pressed;
    P.setPhase("gameover"); if (doc.getElementById("diffPick").style.display === "none") return "picker hidden on gameover";
    P.setPhase("play"); if (doc.getElementById("diffPick").style.display !== "none") return "picker visible during play";
    toNormal();
  });
  const clearRank = () => { for (const k of ["pacman-rank", "pacman-rank-easy", "pacman-rank-hard"]) win.localStorage.removeItem(k); };
  t("ランキング：降順に並び、上位5件だけ残り、0点は記録されない", () => {
    clearRank(); P.setPhase("title"); P.setDifficulty("normal");
    const got = [];
    for (const sc of [100, 500, 300, 700, 200, 900, 0]) { P.state.score = sc; P.recordScore(); got.push(P.state.lastRank); }
    const list = P.loadRank("normal");
    const stored = JSON.parse(win.localStorage.getItem("pacman-rank"));   // 読み込み時の絞りに頼らず、保存された中身そのものを確認
    if (list.join() !== "900,700,500,300,200") { clearRank(); return list; }          // 100 は圏外で押し出される
    if (stored.join() !== "900,700,500,300,200") { clearRank(); return { stored }; }   // 0点が保存されていない・6件以上保存されていない
    if (got.join() !== "0,0,1,0,3,0,-1") { clearRank(); return got; }   // 各回に入った順位（0点と最下位未満は -1）
    P.state.score = 50; P.recordScore();                              // 5件が埋まっている状態で最下位より低い点は圏外
    const outOfRange = P.state.lastRank; clearRank();
    if (outOfRange !== -1) return ["out of range must be -1", outOfRange];
  });
  t("ランキング：空き枠があっても0点は記録されない", () => {
    clearRank(); P.setPhase("title"); P.setDifficulty("normal");
    P.state.score = 0; P.recordScore(); const empty = win.localStorage.getItem("pacman-rank");
    P.state.score = 80; P.recordScore(); P.state.score = 0; P.recordScore();   // 1件だけ入った状態でも0点は入らない
    const list = P.loadRank("normal"), rank = P.state.lastRank;
    clearRank();
    if (empty !== null) return { empty };
    if (list.join() !== "80" || rank !== -1) return { list, rank };
  });
  t("ランキング：同点は先に記録した方が上位／壊れたデータは空として扱う", () => {
    clearRank(); P.setPhase("title"); P.setDifficulty("normal");
    P.state.score = 400; P.recordScore(); P.state.score = 400; P.recordScore();
    const tie = P.state.lastRank, list = P.loadRank("normal");
    win.localStorage.setItem("pacman-rank", "{not json"); const broken = P.loadRank("normal");
    win.localStorage.setItem("pacman-rank", '["a",null,7]'); const mixed = P.loadRank("normal");
    clearRank();
    if (!(tie === 1 && list.join() === "400,400")) return { tie, list };
    if (broken.length !== 0 || mixed.join() !== "7") return { broken, mixed };
  });
  t("ランキング：難易度ごとに別々・保存が失敗しても例外にならない", () => {
    clearRank(); P.setPhase("title");
    P.setDifficulty("easy"); P.state.score = 111; P.recordScore();
    P.setDifficulty("hard"); P.state.score = 222; P.recordScore();
    const e = P.loadRank("easy").join(), h = P.loadRank("hard").join(), n = P.loadRank("normal").join();
    const proto = win.Storage.prototype, setI = proto.setItem; proto.setItem = () => { throw new Error("denied"); };
    try { P.state.score = 333; P.recordScore(); } finally { proto.setItem = setI; }
    clearRank(); toNormal();
    if (!(e === "111" && h === "222" && n === "")) return { e, h, n };
  });
  t("ランキング：ゲームオーバーで記録・表示され、今回の記録が強調される", () => {
    clearRank(); freshPlay(); P.state.lives = 1; P.state.score = 1234;
    ghostOnPac(P.ghosts[0]); P.frightTimer = 0; P.tick(0.05); P.tick(2.0);
    if (P.state.phase !== "gameover") return P.state.phase;
    const items = () => [...doc.querySelectorAll("#rank li")];
    const rows = items().map(li => li.textContent);
    if (rows[0] !== "RANKING · NORMAL" || rows[1] !== "1位　1234") return rows;
    if (!items()[1].classList.contains("me")) return "new entry not highlighted";
    P.setDifficulty("hard");                                          // 別の難易度に切り替えると、その難易度の表示になり強調は消える
    const hardRows = items().map(li => li.textContent), hardMe = items().some(li => li.classList.contains("me"));
    if (hardRows.join() !== "RANKING · HARD,まだ記録がありません" || hardMe) return { hardRows, hardMe };
    P.setPhase("play"); if (doc.getElementById("rank").style.display !== "none") return "ranking visible during play";
    clearRank(); toNormal();
  });
  t("迷路：全ての迷路で、初期位置から全エサに到達でき（ワープ含む）、行き止まりがない", () => {
    const res = [];
    P.MAZES.forEach((M, idx) => {
      const cell = (c, r) => (r < 0 || r >= 31) ? "#" : M[r][((c % 28) + 28) % 28];
      const walk = (c, r) => !"#X-".includes(cell(c, r));
      const seen = new Set(["13,23"]); const q = [[13, 23]];
      if (!walk(13, 23)) res.push({ maze: idx, why: "start blocked" });
      while (q.length) {
        const [c, r] = q.shift();
        for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nc = ((c + dc) % 28 + 28) % 28, nr = r + dr;
          if (nr < 0 || nr >= 31 || !walk(nc, nr)) continue;
          const k = nc + "," + nr; if (!seen.has(k)) { seen.add(k); q.push([nc, nr]); }
        }
      }
      const missing = []; let pellets = 0, power = 0, dead = [];
      for (let r = 0; r < 31; r++) for (let c = 0; c < 28; c++) {
        const ch = M[r][c];
        if (ch === "." || ch === "o") { pellets++; if (ch === "o") power++; if (!seen.has(c + "," + r)) missing.push([c, r]); }
        const inHouse = r >= 9 && r <= 19 && c >= 8 && c <= 19;
        if (".o ".includes(ch) && r !== 14 && !inHouse) {
          const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dc, dr]) => walk(c + dc, r + dr)).length;
          if (n <= 1) dead.push([c, r]);
        }
      }
      if (missing.length || dead.length || power !== 4) res.push({ maze: idx, missing, dead, power });
      if (M.length !== 31 || M.some(row => row.length !== 28 || row !== [...row].reverse().join(""))) res.push({ maze: idx, why: "size or symmetry" });
      for (let r = 9; r <= 19; r++) if (M[r] !== P.MAZES[0][r]) res.push({ maze: idx, why: "house area differs", r });
    });
    if (res.length) return res;
  });
  t("迷路：レベルごとに迷路が順番に（1→2→3→1）切り替わり、エサの数・盤面が正しく入れ替わる", () => {
    freshPlay(); const m1 = P.MAZE, n1 = P.totalPellets;
    P.pelletsLeft = 1; P.tick(0.5); P.tick(2.2);                       // レベル1をクリア → レベル2
    const m2 = P.MAZE, n2 = P.totalPellets, g2 = P.grid.map(r => r.join("")).join("|");
    P.tick(2.0); P.pelletsLeft = 1; P.tick(0.5); P.tick(2.2);          // レベル2をクリア → レベル3
    const m3 = P.MAZE, level = P.state.level, n3 = P.totalPellets;
    P.tick(2.0); P.pelletsLeft = 1; P.tick(0.5); P.tick(2.2);          // レベル3をクリア → レベル4(迷路1に戻る)
    const m4 = P.MAZE;
    const same = (a, b) => a === b;
    if (!(same(m1, P.MAZES[0]) && same(m2, P.MAZES[1]) && same(m3, P.MAZES[2]) && same(m4, P.MAZES[0]) && level === 3 && P.state.level === 4)) return { level, m1: m1 === P.MAZES[0], m2: m2 === P.MAZES[1], m3: m3 === P.MAZES[2], m4: m4 === P.MAZES[0] };
    if (n3 !== P.MAZES[2].join("").replace(/[^.o]/g, "").length || P.MAZES.length !== 3 || P.MAZES[2].join() === P.MAZES[1].join() || P.MAZES[2].join() === P.MAZES[0].join()) return { n3, len: P.MAZES.length };
    if (!(n1 === 246 && n2 === 250 && g2 === P.MAZES[1].join("|").replace(/[^.o#X\- |]/g, " "))) {
      const expect = P.MAZES[1].join("|"); return { n1, n2, gridMatches: g2 === expect };
    }
  });
  t("ゴーストが固まらない：プレイ中は全員が常に動き続ける（5分相当×3回）", () => {
    const stuck = [];
    for (let round = 0; round < 3; round++) {
      freshPlay(); P.frightTimer = round === 2 ? 999 : 0;   // 3回目はイジケ(ランダム移動)状態
      const last = P.ghosts.map(g => ({ k: "", t: 0 }));
      for (let i = 0; i < 300 * 10; i++) {
        P.pac.c = 13; P.pac.r = 23; P.pac.prog = 0;          // パックマンは動かさず(被弾しないよう)ゴーストだけ観察
        if (P.state.phase !== "play") P.state.phase = "play";
        P.tick(0.1);
        P.ghosts.forEach((g, n) => {
          const k = [g.c, g.r, g.prog.toFixed(2), g.mode].join();
          if (k !== last[n].k) { last[n].k = k; last[n].t = i; }
          else if (i - last[n].t > 20 && g.mode !== "house") stuck.push({ ghost: g.name, c: g.c, r: g.r, mode: g.mode, round });
        });
      }
    }
    if (stuck.length) return stuck.slice(0, 3);
  });
  const ptr = (el, type, x, y, id = 1) => el.dispatchEvent(new win.PointerEvent(type, { bubbles: true, pointerId: id, isPrimary: true, clientX: x, clientY: y }));
  const wrapEl = () => doc.getElementById("wrap");
  t("スマホ操作：スワイプは指を離す前に反応し、連続で方向を変えられ、離してもポーズしない", () => {
    freshPlay(); const w = wrapEl(), b = w.getBoundingClientRect(), x = b.x + b.width / 2, y = b.y + b.height / 2;
    ptr(w, "pointerdown", x, y); ptr(w, "pointermove", x, y - 30);
    if (P.pac.want !== "up") return ["up", P.pac.want];
    ptr(w, "pointermove", x + 40, y - 30); if (P.pac.want !== "right") return ["right", P.pac.want];   // 起点が更新され、連続して曲がれる
    ptr(w, "pointermove", x + 40, y + 10); if (P.pac.want !== "down") return ["down", P.pac.want];
    ptr(w, "pointerup", x + 40, y + 10); if (P.state.phase !== "play") return ["paused by swipe", P.state.phase];
  });
  t("スマホ操作：軽いタップでポーズ/再開。小さな指の揺れはスワイプにならず、キャンセルでは切り替わらない", () => {
    freshPlay(); const w = wrapEl(), b = w.getBoundingClientRect(), x = b.x + b.width / 2, y = b.y + b.height / 2;
    const want0 = P.pac.want;
    ptr(w, "pointerdown", x, y); ptr(w, "pointermove", x + 10, y + 5); ptr(w, "pointerup", x + 10, y + 5);   // 22px 未満の揺れ = タップ
    if (P.state.phase !== "paused") return ["tap should pause", P.state.phase];
    if (P.pac.want !== want0) return ["wobble changed direction", P.pac.want];
    ptr(w, "pointerdown", x, y); ptr(w, "pointerup", x, y); if (P.state.phase !== "play") return ["tap should resume", P.state.phase];
    ptr(w, "pointerdown", x, y, 2); ptr(w, "pointercancel", x, y, 2); if (P.state.phase !== "play") return ["cancel toggled", P.state.phase];
    ptr(w, "pointerdown", x, y, 3); ptr(w, "pointerup", x, y, 4); if (P.state.phase !== "play") return ["other pointer toggled", P.state.phase];
  });
  t("スマホ操作：十字ボタン・中央ボタン・リスタートボタンが効く", () => {
    freshPlay(); const btn = sel => doc.querySelector(sel);
    for (const d of ["up", "down", "right", "left"]) { ptr(btn(`#dpad [data-dir="${d}"]`), "pointerdown", 0, 0); if (P.pac.want !== d) return [d, P.pac.want]; }
    ptr(btn("#btnAction"), "pointerdown", 0, 0); if (P.state.phase !== "paused" || btn("#btnAction").textContent !== "▶") return ["pause", P.state.phase, btn("#btnAction").textContent];
    ptr(btn("#btnAction"), "pointerdown", 0, 0); if (P.state.phase !== "play" || btn("#btnAction").textContent !== "⏸") return ["resume", P.state.phase];
    P.state.score = 500; ptr(btn("#btnRestart"), "pointerdown", 0, 0); if (!(P.state.phase === "ready" && P.state.score === 0)) return ["restart", P.state.phase, P.state.score];
    P.setPhase("title");
  });
  t("描画解像度：表示サイズに合わせた倍率になり、盤面が縮小されても過剰に描かない", () => {
    const cv = doc.getElementById("game"), wrap = doc.getElementById("wrap");
    const dpr = win.devicePixelRatio || 1, css = cv.getBoundingClientRect().width;
    const need = css * dpr / 560;                                             // 表示に必要な倍率
    if (P.DPR < 1 || P.DPR > 3) return ["scale out of range", P.DPR];
    if (cv.width !== Math.round(560 * P.DPR) || cv.height !== Math.round(620 * P.DPR)) return ["backing size mismatch", cv.width, cv.height, P.DPR];
    if (P.DPR < Math.min(need, 3) - 0.01) return ["under-sampled", P.DPR, need];   // 足りない（ぼやける）
    if (P.DPR > Math.max(1, need) + 0.26) return ["over-sampled", P.DPR, need];     // 多すぎる（無駄な描画）
  });
  t("描画解像度：DPR3の端末で盤面の表示サイズが変わると、倍率と迷路レイヤーが追従して作り直される", () => {
    const cv = doc.getElementById("game"), wrap = doc.getElementById("wrap");
    const realDpr = Object.getOwnPropertyDescriptor(win, "devicePixelRatio");
    Object.defineProperty(win, "devicePixelRatio", { configurable: true, get: () => 3 });   // DPR3 のスマホを再現
    const refit = (wpx) => { wrap.style.width = wpx; win.dispatchEvent(new win.Event("resize")); return { scale: P.DPR, w: cv.width, h: cv.height, css: Math.round(cv.getBoundingClientRect().width), layer: P.mazeLayerSize }; };
    const lit = () => { P.draw(0); const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 0) n++; return n; };
    const oldW = wrap.style.width, res = {};
    try {
      freshPlay();
      res.big = refit("560px");   res.bigLit = lit();       // 560px 表示 → 3 倍が必要
      res.mid = refit("366px");   res.midLit = lit();       // 一般的なスマホ縦向き(約 362px)
      res.small = refit("300px"); res.smallLit = lit();     // 横向きなど小さい表示
    } finally {
      if (realDpr) Object.defineProperty(win, "devicePixelRatio", realDpr); else delete win.devicePixelRatio;
      wrap.style.width = oldW; win.dispatchEvent(new win.Event("resize"));
    }
    const near = (r) => r.w / (r.css * 3);                    // 表示に必要な解像度に対する倍率(1.0 が理想)
    if (!(res.big.scale === 3 && res.big.w === 1680)) return res;                            // 大きい表示では最大倍率
    if (!(res.mid.scale < res.big.scale && res.small.scale < res.mid.scale)) return res;     // 表示が小さいほど倍率も下がる
    if (!(near(res.mid) >= 0.98 && near(res.mid) <= 1.3 && near(res.small) >= 0.98 && near(res.small) <= 1.3)) return res;   // ぼやけず、過剰でもない
    if (!(res.mid.w === Math.round(560 * res.mid.scale) && res.small.h === Math.round(620 * res.small.scale))) return res;     // キャンバスの実サイズが倍率と一致
    if (!(res.bigLit > 5000 && res.midLit > 5000 && res.smallLit > 5000)) return res;        // 倍率が変わった後も迷路が描かれる
    for (const k of ["big", "mid", "small"]) { const r = res[k]; if (!(r.layer && r.layer[0] === r.w && r.layer[1] === r.h && r.layer[2] === r.w)) return { why: "maze layer not rebuilt for new scale", k, r }; }   // 迷路レイヤーの実サイズがキャンバスと一致
  });
  t("不変条件：長時間プレイ中、エサの残数と盤面が常に一致し、得点は減らず、巣の外のゴーストは巣に入らない", () => {
    const dirs = ["up", "down", "left", "right"]; const bad = [];
    const count = () => { let n = 0; for (const row of P.grid) for (const ch of row) if (ch === "." || ch === "o") n++; return n; };
    const inHouse = g => g.r >= 13 && g.r <= 15 && g.c >= 11 && g.c <= 16;     // 巣の内部(壁に囲まれた空間)
    for (const d of ["easy", "normal", "hard"]) {
      P.setPhase("title"); P.setDifficulty(d); P.state.high = 0; P.newGame();
      let lastScore = 0, lastLevel = 1;
      for (let i = 0; i < 12 * 60 * 10 && bad.length < 3; i++) {
        if (i % 3 === 0) P.handleDir(dirs[(Math.random() * 4) | 0]);
        P.tick(0.1);
        const ph = P.state.phase;
        if (ph === "gameover" || ph === "paused") { P.handleAction(); lastScore = 0; lastLevel = 1; continue; }
        if (ph === "levelclear" || ph === "ready") { lastScore = P.state.score; lastLevel = P.state.level; continue; }
        if (count() !== P.pelletsLeft) bad.push({ d, i, why: "pellets", grid: count(), counter: P.pelletsLeft });
        if (P.state.score < lastScore && P.state.level === lastLevel) bad.push({ d, i, why: "score decreased", from: lastScore, to: P.state.score });
        lastScore = P.state.score; lastLevel = P.state.level;
        if (P.state.lives < 0 || P.state.lives > 12) bad.push({ d, i, why: "lives", lives: P.state.lives });
        for (const g of P.ghosts) if (g.mode === "out" && inHouse(g)) bad.push({ d, i, why: "ghost entered house", name: g.name, c: g.c, r: g.r });
      }
    }
    toNormal();
    if (bad.length) return bad.slice(0, 3);
  });
  t("30分相当のランダムプレイで壁抜け・NaN・例外が出ない", () => {
    const dirs = ["up", "down", "left", "right"]; let walls = 0, nan = 0;
    P.state.high = 0; P.newGame();
    for (let i = 0; i < 30 * 60 * 10; i++) {
      if (i % 3 === 0) P.handleDir(dirs[(Math.random() * 4) | 0]);
      P.tick(0.1);
      for (const g of P.ghosts) { if (isWall(g.c, g.r)) walls++; if (!Number.isFinite(g.prog)) nan++; }
      if (isWall(P.pac.c, P.pac.r)) walls++;
      if (P.state.phase === "gameover" || P.state.phase === "paused") P.handleAction();
    }
    if (walls || nan || errors.length) return { walls, nan, errors };
  });

  try { for (const k of ["pacman-high", "pacman-high-easy", "pacman-high-hard", "pacman-diff", "pacman-muted", "pacman-rank", "pacman-rank-easy", "pacman-rank-hard"]) win.localStorage.removeItem(k); } catch (e) { /* 無視 */ }
  const s = document.getElementById("summary");
  s.textContent = `${passed + failed} 件中 ${passed} 件成功` + (failed ? `、${failed} 件失敗` : "");
  s.className = failed ? "ng" : "ok";
  document.title = (failed ? "FAIL" : "PASS") + " - PAC-MAN 自動テスト";
});

frame.src = "index.html#test";
</script>
